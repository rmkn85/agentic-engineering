# Opt-in native Codex routing preset. Policy: 2026-10-27; source audit: 2026-10-04.
# EXAMPLE to merge, not an installer. Preserve permissions and unrelated settings.
# A saved app selection is not a dispatch plan; these defaults do not choose
# the executor, model/effort or number of workers for the next outcome.
# Audit: docs/local-codex/multi-agent-v2.md (OpenAI source snapshot d0759639).
# Match the actual CLI/app backend and inspect effective custom roles.
# No native model allowlist, per-worker budget or exact billing cap is installed.

model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
service_tier = "default"
# Permission policy is separate from model routing. For an owner-approved
# sandbox-first setup, native granular sandbox_approval=false and rules=false
# reject unallowlisted command prompt categories. Preserve unrelated categories;
# install reviewed narrow activity rules through an authorized path first.
# See docs/adoption/native-command-bindings.md#sandbox-first-external-activities.
# Leave model_context_window and model_auto_compact_token_limit unset to use the
# selected model's advertised/default limits. Preserve a measured intentional
# override when merging; review old fixed thresholds after a model change.

# General worker settings complement, not replace, the native V2 configuration.
[agents]
enabled = true
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"
# Optional workload cap; do not set contradictory values in two tables:
# max_concurrent_threads_per_session = 2
# max_depth is V1-only; it does NOT prevent V2 grandchildren.

[features.multi_agent_v2]
enabled = true
# Exposes actual model and reasoning_effort fields on native V2 spawn_agent.
# True in the inspected runtime defaults; explicit here for the routing contract.
expose_spawn_agent_model_overrides = true
# Preserve an existing intentional mode hint when merging. It changes delegation
# policy independently of model/effort defaults and should not be silently erased.
multi_agent_mode_hint_text = """
Delegate when context isolation, specialized attention, continuity or parallel
progress outweighs coordination cost. Use deterministic tools for mechanical
work and keep tightly coupled judgment local. Select the executor and useful
agent count for the next outcome, including zero new agents; a saved app model
selection or changed default does not replace this choice. Choose capability, effort,
context, lifetime and autonomy independently. Use Luna low for usage monitoring,
Git operations and CI-log triage, Luna medium for bounded coding, and Sol 6.1
medium for sustained engineering. Use Terra 6.1 medium for visual interpretation,
evidence presentation and clear writing, or low for straightforward rewriting.
Check its claims against the actual artifact; stills do not prove motion or human
acceptance. This does not authorize desktop control or change all agent defaults.
Use Astra medium/high for extremely creative
or complex graphics, architecture or academic reasoning. High needs a specific
reason. Never use Ultra unless the current owner instruction explicitly says
to exhaust allowance before reset; stop that work on observed exhaustion,
reset or the owner deadline. Paid credits do not extend that authorization.
Keep monitoring on tools/Luna even then. Preserve useful work and feedback,
but transfer a compact result when the next phase requires a different executor.
Never reactivate an Ultra worker after its exception ends.
At meaningful checkpoints use the Codex usage API to compare depletion with
rough expected work/pace and reset horizon. Tools/Luna collect it, without an
inference loop or fixed burn target. Investigate surprises including execution,
shared-account and possible platform/reporting causes; keep attribution honest.
Slow/stop when warranted. Get owner approval before materially accelerating
spending beyond explicit authorization; reset proximity alone grants none.
Distinguish ongoing portfolio orchestrators, autonomous epic owners, persistent
low-traffic steering reviewers, bounded specialists and short execution workers.
Epic owners retain context/worktrees and continue through accepted delivery,
choosing next steps, resolving blockers and delegating within their authority.
Estimates and checkpoints prompt steering, never invented token/time stop budgets
or routine renewal requests. Preserve cumulative use and actual user/runtime
limits; unknown measurement is not exhaustion. A bounded diagnostic can end
without ending the epic. Steering reviewers review useful checkpoints without
continuous polling. Retire short workers after their result and epic owners after
acceptance/integration or a genuine stop/handoff. Isolate concurrent writers in
owned worktrees; coordinate shared boundaries and integration, not each next
step. Use PRs where repository policy requires them. Preserve
source/data/evidence before clearing owned scratch; retain valid shared caches.
Prepare sandboxed work first. External effects use reviewed parameterized native
activities with narrow approval/allowlisting; reject ad-hoc inline escalation.
Select model, reasoning_effort and fork_turns explicitly at launch. Follow the
owner's scoped co-developer authorization, including model/effort, concurrency
and descendant limits; this generic preset grants no additional exception.
Otherwise ordinary workers may not delegate. Define outcome, ownership,
acceptance, lifetime, checkpoints and genuine limits proportionally. Follow-ups
and authorized descendants preserve cumulative observations and real limits;
do not manufacture a numeric epic cap. Inspect decisive evidence without repeating delegated
work. Apply the same routing during review and follow-ups. Use efficient-execution
when available. Concurrency is capacity, not a target.
"""

# These settings affect different things; do not change them by name alone:
# hide_spawn_agent_metadata: presentation, NOT a resolved model/effort receipt.
# root_agent_usage_hint_text/subagent_usage_hint_text: replace built-in role text.
# subagent_developer_instructions: replaces inherited worker developer guidance.
# non_code_mode_only: direct-model versus nested code-mode tool exposure,
#                    NOT whether the task involves programming.
# wait timeout settings: mailbox waiting, NOT worker runtime/deadline budgets.
# Leave these and message-board settings at working defaults unless needed.

# Custom roles override explicit spawn model/effort, then defaults, then parent.
# Set BOTH model and model_reasoning_effort in selected role files. The hint does
# not configure a model by itself; verify actual tool calls and native settings.
# V2 fork_turns is a spawn argument: "none", "all" (default), or a positive
# integer string. Fork/override compatibility depends on the live tool schema.
# followup_task has no model/effort fields: transfer findings to a new cheaper
# worker when a configuration change is needed; do not spend again by accident.

# Optional native features.rollout_budget is separate from this routing preset.
# The inspected controller raises SessionBudgetExceeded after shared root/worker
# accounting reaches its limit; it is more than reminders. Accounting can occur
# after an inference and in-flight work may overshoot. It is not a precise dollar
# cap, a per-child allocation, or an automatically durable cross-process budget.
# Do not install an arbitrary global limit. Validate the actual client's fields
# and measure scope/overshoot before relying on it. See the source audit.

# To intentionally disable delegation, turn off BOTH effective controls:
# [agents] enabled = false AND [features.multi_agent_v2] enabled = false.
# Enabled V2 takes precedence over agents.enabled=false. Verify a fresh run.
# Never disable V2 merely because a documentation index omits its typed fields.

# Other top-level overrides belong BEFORE tables when merging this example.
# Preserve intentional compaction, permission, approval, provider and tool settings.
# Concurrency, context limits and soft prompt budgets are not exact spending caps.
