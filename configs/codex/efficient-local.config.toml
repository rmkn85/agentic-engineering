# Opt-in Codex model-routing preset. Reviewed 2026-10-04.
# This file is an EXAMPLE to merge into the user's or trusted project's config;
# checking out this repository does not install it or edit the user's settings.
# Keep existing permissions, approvals, providers, tools and unrelated settings.
# No native model allowlist or hard spending limit is installed by this preset.
# Policy and sources: docs/local-codex/subagents.md#named-model-and-effort-policy
# Native settings: https://learn.chatgpt.com/docs/agent-configuration/subagents
# Configuration: https://learn.chatgpt.com/docs/config-file/config-reference
# Verify these IDs and efforts in the actual client/account before adoption.

# Substantial coding, integration and orchestration. Choose Luna explicitly for
# a lightweight main task when adequate; user-directed Astra planning is separate.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
service_tier = "default"

[agents]
enabled = true
# Safety net, NOT a substitute for explicit per-dispatch model/effort selection.
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"
# Optional workload choice, not a total-cost cap or universal optimum:
# max_concurrent_threads_per_session = 2

# Runtime policy belongs in efficient-execution / applicable AGENTS.md:
# - Luna low for routine work, medium for focused judgment, high for a specific
#   deeper reasoning need. Sol medium/high only for justified complex subtasks.
# - No Astra worker, automatic model substitution or xhigh/max/ultra worker.
# - Set bounded context and finite assignment + aggregate budgets before launch.
# - Reuse/follow-up must remain compliant and debit the existing allocation.
# - Ratios are review heuristics, not quotas. No mandatory 20% Sol or High spend.
# Use supported launch controls or a selected inspected role. Custom agent files
# override explicit spawn values, which override these defaults, then parent
# fallback. Set BOTH model and model_reasoning_effort in selected role files;
# inspect existing ~/.codex/agents/ and project .codex/agents/ overrides.
# Parent inheritance by omission is not intentional model selection.
# There is no native allowlist key introduced here. The permitted pairs are in
# the skill; they work as policy even when no config/custom role is installed.

# Migration from an older [features.multi_agent_v2] hint:
# The current public configuration reference documents [agents], not that stanza
# or multi_agent_mode_hint_text. Do not rely on a prose hint to set worker models.
# Keep routing instructions in the skill/AGENTS.md; check the installed client's
# supported controls before removing version-specific configuration. A fresh
# run must verify effective settings; existing threads keep their old state.

# -----------------------------------------------------------------------------
# Other OPTIONAL, workload-dependent settings
# Place TOP-LEVEL keys before [agents] when merging; TOML tables continue until
# another table begins. The examples below are comments, not active settings.
# -----------------------------------------------------------------------------

# Retain full logs outside model context; do not truncate decisive diagnostics.
# tool_output_token_limit = 4000
# Bound persistent instructions only after observing a real footprint problem.
# project_doc_max_bytes = 16384
# Use cached search only when freshness is not required.
# web_search = "cached"
# Keep the platform's compaction defaults unless evidence justifies a threshold.
# A compaction threshold is not a per-worker token or spending budget.
# Preserve an existing intentional threshold when changing model routing alone.

# Do not infer a hard cap from concurrency, rollout tracking or a prompt budget.
# Label attempt/time/token limits as soft unless the host actually enforces them.
# Required hard cap unavailable -> no dispatch through that path.
# Disable native multi-agent tools, when needed, with enabled = false in [agents].
# Do not invent budget/allowlist keys or introduce an orchestration service.
