name: Verify contributor tools
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contributor-tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Exercise native checks from cold and stale committed source
        run: make contributor-trial
      - name: Prove each guarded rule's tests fail when the rule is disabled
        run: make prove
      - name: Refuse runtime prose growth that no test or trial checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then BASE_SHA=HEAD^1; fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          make guidance-delta BASE="$BASE_SHA"
          make review-check BASE="$BASE_SHA"
