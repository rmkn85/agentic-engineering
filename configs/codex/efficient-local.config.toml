# Opt-in native Codex routing preset. Source audit: 2026-10-04.
# EXAMPLE to merge, not an installer. Preserve permissions and unrelated settings.
# Audit: docs/local-codex/multi-agent-v2.md (OpenAI source snapshot d0759639).
# Match the actual CLI/app backend and inspect effective custom roles.
# No native model allowlist, per-worker budget or exact billing cap is installed.

model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
service_tier = "default"

# General worker settings complement, not replace, the native V2 configuration.
[agents]
enabled = true
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"
# Optional workload cap; do not set contradictory values in two tables:
# max_concurrent_threads_per_session = 2
# max_depth is V1-only; it does NOT prevent V2 grandchildren.

[features.multi_agent_v2]
enabled = true
# Exposes actual model and reasoning_effort fields on native V2 spawn_agent.
# True in the inspected runtime defaults; explicit here for the routing contract.
expose_spawn_agent_model_overrides = true
# Preserve an existing intentional mode hint when merging. It changes delegation
# policy independently of model/effort defaults and should not be silently erased.
multi_agent_mode_hint_text = """
Cost-aware delegation is active. The owner authorizes the root coordinator to
select workers deliberately: Luna Low/Medium normally, Luna High or Sol
Medium/High for a specific justified subtask. Never dispatch Astra or above-High
effort. Use exact tools for mechanical work and delegate only when worthwhile.
Select model, reasoning_effort and fork_turns explicitly. Prefer fork_turns="none"
with a sufficient bounded handoff; workers must not spawn descendants. Reuse
requires compliant configuration and remaining assignment budget. Preserve all
permissions and acceptance. Apply efficient-execution when available.
"""

# These settings affect different things; do not change them by name alone:
# hide_spawn_agent_metadata: presentation, NOT a resolved model/effort receipt.
# root_agent_usage_hint_text/subagent_usage_hint_text: replace built-in role text.
# subagent_developer_instructions: replaces inherited worker developer guidance.
# non_code_mode_only: direct-model versus nested code-mode tool exposure,
#                    NOT whether the task involves programming.
# wait timeout settings: mailbox waiting, NOT worker runtime/deadline budgets.
# Leave these and message-board settings at working defaults unless needed.

# Custom roles override explicit spawn model/effort, then defaults, then parent.
# Set BOTH model and model_reasoning_effort in selected role files. The hint does
# not configure a model by itself; verify actual tool calls and native settings.
# V2 fork_turns is a spawn argument: "none", "all" (default), or a positive
# integer string. Current V2 full-history forks CAN override models and roles.
# followup_task has no model/effort fields: transfer findings to a new cheaper
# worker when a configuration change is needed; do not spend again by accident.

# Optional native features.rollout_budget is separate from this routing preset.
# The inspected controller raises SessionBudgetExceeded after shared root/worker
# accounting reaches its limit; it is more than reminders. Accounting can occur
# after an inference and in-flight work may overshoot. It is not a precise dollar
# cap, a per-child allocation, or an automatically durable cross-process budget.
# Do not install an arbitrary global limit. Validate the actual client's fields
# and measure scope/overshoot before relying on it. See the source audit.

# To intentionally disable delegation, turn off BOTH effective controls:
# [agents] enabled = false AND [features.multi_agent_v2] enabled = false.
# Enabled V2 takes precedence over agents.enabled=false. Verify a fresh run.
# Never disable V2 merely because a documentation index omits its typed fields.

# Other top-level overrides belong BEFORE tables when merging this example.
# Preserve intentional compaction, permission, approval, provider and tool settings.
# Concurrency, context limits and soft prompt budgets are not exact spending caps.
